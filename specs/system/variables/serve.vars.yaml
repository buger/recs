component: serve
variables:
    - name: serve_command_invoked
      type: bool
      direction: input
      description: Decide condition serve command invoked.
    - name: http_bound_localhost
      type: bool
      direction: output
      description: Decide condition http bound localhost.
    - name: default_port_selected
      type: bool
      direction: output
      description: Decide condition default port selected.
    - name: custom_port_selected
      type: bool
      direction: output
      description: Decide condition custom port selected.
    - name: static_ui_served
      type: bool
      direction: output
      description: Decide condition static ui served.
    - name: shared_app_layer_used
      type: bool
      direction: output
      description: Decide condition shared app layer used.
    - name: shared_record_model_used
      type: bool
      direction: output
      description: Decide condition shared record model used.
    - name: separate_database_used
      type: bool
      direction: output
      description: Decide condition separate database used.
    - name: listen_port
      type: int
      direction: input
      description: TCP port for the local HTTP server.
      range:
        max: 65535
        min: 1
    - name: gallery_requested
      type: bool
      direction: input
      description: Decide condition gallery requested.
    - name: gallery_rendered
      type: bool
      direction: output
      description: Decide condition gallery rendered.
    - name: preview_cards_shown
      type: bool
      direction: output
      description: Decide condition preview cards shown.
    - name: remaining_ui_requested
      type: bool
      direction: input
      description: Decide condition remaining UI surface requested.
    - name: record_view_rendered
      type: bool
      direction: output
      description: Decide condition record view rendered.
    - name: record_editor_saved
      type: bool
      direction: output
      description: Decide condition record editor saved.
    - name: search_page_shown
      type: bool
      direction: output
      description: Decide condition search page shown.
    - name: board_filters_applied
      type: bool
      direction: output
      description: Decide condition board filters applied.
    - name: attachment_served
      type: bool
      direction: output
      description: Decide condition attachment served.
    - name: wikilink_resolved
      type: bool
      direction: output
      description: Decide condition wikilink resolved.
    - name: ui_request_rejected
      type: bool
      direction: output
      description: Decide condition remaining UI request rejected.
    - name: dashboards_present
      type: bool
      direction: input
      description: Decide condition at least one dashboard file exists.
    - name: empty_gallery_shown
      type: bool
      direction: output
      description: Decide condition the gallery shows an empty state.
    - name: gallery_rejected
      type: bool
      direction: output
      description: Decide condition the gallery request is rejected.
domain:
    mutex:
        - name: listen_port_mode
          members:
            - default_port_selected
            - custom_port_selected
          reason: Serve selects either the default port or a custom port.
