component: dist
variables:
    - name: ape_build_requested
      type: bool
      direction: input
      description: Decide condition APE build requested.
    - name: cosmocc_available
      type: bool
      direction: input
      description: Decide condition cosmocc toolchain available.
    - name: host_os_supported
      type: bool
      direction: input
      description: Decide condition host OS supported by embedded blob.
    - name: ape_binary_produced
      type: bool
      direction: output
      description: Decide condition APE binary produced.
    - name: native_blob_embedded
      type: bool
      direction: output
      description: Decide condition native blob embedded.
    - name: ape_runs_on_host
      type: bool
      direction: output
      description: Decide condition APE runs on host.
    - name: ape_build_rejected
      type: bool
      direction: output
      description: Decide condition APE build rejected.
    - name: rc
      type: int
      direction: input
      description: APE wrapper process exit code.
      range:
        max: 255
        min: 0
no_interface:
    declared: true
    reason: This component is an internal library called only through the shared app layer; CLI and serve INT-REQs already own the operator-facing boundary.
