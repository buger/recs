obligation_hazards:
    - class: boundary
      worst_case: A layout with more than four slots is treated as unbounded and the page jumps.
      severity: low
    - class: empty_input
      worst_case: An empty dashboards directory is treated as a crash, so init cannot start.
      severity: low
    - class: error_handling
      worst_case: A failed dashboard load is reported as success, so the gallery shows a false view.
      severity: medium
    - class: nominal
      worst_case: A valid dashboard request does not project widgets from the YAML files.
      severity: low
