obligation_checklist:
    - boundary
    - empty_input
    - error_handling
    - malformed_input
    - nominal
obligation_hazards:
    - class: boundary
      worst_case: Empty next or triage prints no text, so agents treat a blank success as a hang.
      severity: low
    - class: empty_input
      worst_case: A missing ingest file or empty search hangs or succeeds, so agents cannot recover.
      severity: medium
    - class: error_handling
      worst_case: A failed JSON command returns unstructured text, so agents cannot parse the failure.
      severity: medium
    - class: malformed_input
      worst_case: An unknown flag or junk --set is accepted as success, so agents persist corrupt work.
      severity: medium
    - class: nominal
      worst_case: A help command omits a live command, so agents cannot discover the next mutation.
      severity: low
