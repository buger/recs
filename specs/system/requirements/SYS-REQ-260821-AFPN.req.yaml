    - class: error_handling
      worst_case: If cosmocc is missing or the host is unsupported, a silent success ships a wrapper that cannot extract or run the native CRM blob.
      severity: medium
    - class: nominal
      worst_case: A successful APE build embeds an empty or wrong native blob, so users download a file that does not run the CRM.
      severity: low
