obligation_checklist:
    - auth_required
    - boundary
    - csrf_protection
    - error_handling
    - input_size_bounded
    - nominal
    - path_traversal_prevented
obligation_hazards:
    - class: auth_required
      worst_case: Callers assume serve is authenticated while any local process can mutate the workspace over loopback.
      severity: low
    - class: boundary
      worst_case: A missing board or empty column set is shown as a server crash, so the local Kanban is unusable.
      severity: low
    - class: csrf_protection
      worst_case: A visited webpage posts to 127.0.0.1 and creates or moves records without the operator intending it.
      severity: medium
    - class: error_handling
      worst_case: An HTTP mutation failure is returned as 200 ok, so the UI believes the file changed.
      severity: medium
    - class: input_size_bounded
      worst_case: An unbounded HTTP body exhausts memory and takes down the local serve process.
      severity: medium
    - class: nominal
      worst_case: A valid localhost request does not read or write through the same app layer as the CLI.
      severity: low
    - class: path_traversal_prevented
      worst_case: An HTTP create id or type writes a Markdown file outside the workspace root via the local API.
      severity: medium
