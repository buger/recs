obligation_hazards:
    - class: boundary
      worst_case: A record at a type or field boundary is rejected as unreadable, so humans cannot edit Markdown without the binary.
      severity: low
    - class: empty_input
      worst_case: An empty new workspace is treated as corrupt, so a file user cannot start from a blank folder.
      severity: low
    - class: error_handling
      worst_case: A failed write is reported as success, so the human edits the wrong file and loses notes.
      severity: medium
    - class: nominal
      worst_case: A valid Markdown record is not shown or listed, so Git history no longer matches what the CRM presents.
      severity: low
