obligation_hazards:
    - class: boundary
      worst_case: A JSON command at a field or enum boundary returns unstructured text, so agents cannot parse the failure.
      severity: medium
    - class: determinism
      worst_case: The same --json command returns a different payload across runs, so agents cannot automate against the workspace.
      severity: medium
    - class: error_handling
      worst_case: A conflict or invalid enum is emitted as a generic crash, so agents retry blindly and overwrite work.
      severity: medium
    - class: malformed_input
      worst_case: Malformed flags or YAML are accepted as ok:true JSON, so agents persist corrupt records.
      severity: medium
    - class: nominal
      worst_case: A valid --json command omits the ok field, breaking the agent contract.
      severity: low
