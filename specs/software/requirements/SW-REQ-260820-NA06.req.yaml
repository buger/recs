obligation_checklist:
    - boundary
    - empty_input
    - error_handling
    - nominal
    - path_traversal_prevented
obligation_hazards:
    - class: boundary
      worst_case: A layout slot count above four is accepted and the gallery cards jump.
      severity: low
    - class: empty_input
      worst_case: A dashboard with no widgets is rejected, so an empty 2x2 cannot render placeholders.
      severity: low
    - class: error_handling
      worst_case: A missing source is treated as a crash, so one bad widget stops the dashboard.
      severity: medium
    - class: nominal
      worst_case: A valid dashboard YAML is not projected, so the CLI and UI disagree on widgets.
      severity: low
    - class: path_traversal_prevented
      worst_case: An attacker-supplied source path reads a file outside the workspace root.
      severity: medium
