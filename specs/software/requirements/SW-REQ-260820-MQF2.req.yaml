    - empty_input
    - error_handling
    - nominal
obligation_hazards:
    - class: empty_input
      worst_case: Init with an empty root refuses to create the workspace, so a new folder cannot become a CRM.
      severity: low
    - class: error_handling
      worst_case: Init with an unusable root is reported as success, so the maintainer thinks a workspace exists.
      severity: low
    - class: nominal
      worst_case: Init succeeds without writing crm.yaml or required directories, so later commands cannot find the workspace.
      severity: low
