obligation_hazards:
    - class: atomic_write
      worst_case: A crash mid-write leaves a truncated Markdown file as the only copy of the record.
      severity: medium
    - class: atomicity
      worst_case: A crash mid-patch leaves a truncated Markdown file as the only copy of the record.
      severity: medium
    - class: concurrent
      worst_case: Two overlapping patches interleave field writes and drop one editor update without a conflict.
      severity: medium
    - class: concurrent_invariant_preserved
      worst_case: Concurrent set or move on the same id loses an update without conflict, forking agent and human edits.
      severity: medium
    - class: error_handling
      worst_case: A version mismatch is applied anyway, so optimistic concurrency no longer protects agent edits.
      severity: medium
