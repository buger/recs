obligation_checklist:
    - boundary
    - error_handling
    - malformed_input
    - malformed_recovers_or_errors_loudly
    - nominal
    - path_traversal_prevented
    - untrusted_input_bounded
obligation_hazards:
    - class: boundary
      worst_case: A record at a type or filename boundary is rejected as unreadable, so a human cannot keep editing Markdown without the binary.
      severity: low
    - class: error_handling
      worst_case: A failed write is reported as success, so the human edits the wrong file and loses notes.
      severity: medium
    - class: malformed_input
      worst_case: Malformed frontmatter is treated as a valid record, so search and boards operate on corrupt canonical files.
      severity: medium
    - class: malformed_recovers_or_errors_loudly
      worst_case: A truncated frontmatter file is silently skipped, hiding corruption from list, search, and validate.
      severity: medium
    - class: nominal
      worst_case: A valid create writes a file without stable id or type, so later show and patch cannot find it.
      severity: low
    - class: path_traversal_prevented
      worst_case: An attacker-supplied record id or type writes a Markdown file outside the workspace root.
      severity: medium
    - class: untrusted_input_bounded
      worst_case: Hostile YAML constructs an unbounded object graph and exhausts memory during frontmatter parse.
      severity: medium
