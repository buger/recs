description: The CLI shall show a command list when the operator uses crm --help or crm help. The CLI shall show flags, examples, and the JSON shape when the operator uses crm help CMD or crm CMD --help. A failed JSON command shall give the fields ok, error, field, allowed, and message. The CLI shall not write AGENTS.md or SKILL.md.
