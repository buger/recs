id: workspace
name: Workspace
description: Deals, onboarding, and notes
layout: 2x2
widgets:
  - id: deals
    type: list
    title: Deal pipeline
    query: 'type=deal'
    group_by: status
    limit: 8
  - id: blocked
    type: count
    title: Blocked onboardings
    query: 'type=onboarding status=blocked'
  - id: board
    type: board
    title: Pipeline
    board: pipeline
  - id: notes
    type: notes
    title: Open questions
    query: 'type=note'
    limit: 4
