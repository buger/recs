name: northshore
default_port: 7777
types:
  deal:
    required:
      - title
      - status
    fields:
      status:
        type: string
        enum:
          - lead
          - talking
          - proposal
          - won
          - lost
  person:
    required:
      - name
  company:
    required:
      - name
  customer:
    required:
      - name
  task:
    required:
      - title
      - status
    fields:
      status:
        type: string
        enum:
          - open
          - done
          - cancelled
  note:
    required:
      - title
  onboarding:
    required:
      - title
      - status
