id: KI-1
title: Cosmopolitan APE packaging is shipped as a host-blob wrapper
description: 'cosmocc is installed at $HOME/.local/cosmocc. make ape produces a real Cosmopolitan APE (crm.com) that embeds the host Go binary as a zip member and extracts it on first run. hello.com and crm.com run on darwin/arm64. A true cosmocc compile of the Go runtime is not available. Remaining host blobs are not embedded: Linux x86-64/ARM64, macOS x86-64, Windows x86-64, and supported BSD targets.'
affected_requirements:
    - SYS-REQ-260820-9W1S
    - STK-REQ-260820-T8AZ
commands:
    - command -v cosmocc
severity: low
severity_basis: risk
risk: correctness
reproducer_command: test -x crm.com && ./crm.com --help
introduced_in: inception
defect_class: latent
mitigation: Ship the APE wrapper plus the native go build. Document remaining OS blobs in docs/distribution.md.
remediation: Cross-compile additional Go blobs and zip them into crm.com as /zip/crm.<os>-<arch> members.
notes:
    - 'Closed 2026-08-21: cosmocc + ape-m1 loader installed; hello.com and crm.com run on this Mac. Remaining gap is extra-OS blobs, not missing APE packaging.'
customer_impact: darwin/arm64 users can chmod +x crm.com and run it. Other OS/arch combinations need a matching zip member before the same file is portable.
owner: Leonid Bugaev
release_disposition: ship_with_known_issue
status: fixed
