id: CHG-260823-E9HJ
type: feature
title: Expand $now in query clause values
intent: Query expressions accept $now (and bare now) as a clause value, expanded to the current UTC timestamp at parse time, so dashboards and CLI filters can express rolling due-date windows without literal dates. Matches the existing set/patch $now semantics.
