id: CHG-260821-DFVQ
type: feature
title: Help and errors are the agent interface
intent: Remove SKILL/AGENTS sidecar files. Agents discover crm through help and structured errors.
problem: Agents were taught by AGENTS.md, SKILL.md, and crm agent install. Those sidecar files are not the interface. Help text and structured JSON errors must be complete enough that an agent can operate the CRM without a skill file.
