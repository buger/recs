name: Bug
description: Something recs did wrong
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Development is done by the maintainers. A good bug report is the contribution. See CONTRIBUTING.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: Command, workspace, and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: recs --help, then the exact commands.
  - type: input
    id: version
    attributes:
      label: recs version / commit
